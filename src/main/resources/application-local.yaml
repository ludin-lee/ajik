spring:
  application:
    name: ajik-local-api
  datasource:
    url: postgresql://localhost:5432/ludin
    username: ludin
    password: ludin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
